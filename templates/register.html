<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Registo - Fintech Dashboard</title>
</head>
<body>
           {% extends "base.html" %}
{% block title %}Criar conta - FintechDash{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] items-center justify-center">
    <div class="w-full max-w-md bg-white dark:bg-slate-900 p-6 rounded border border-blue-200/80 dark:border-slate-800">
        <div class="mb-6">
            <h1 class="text-xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Criar conta</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Cadastre seu email e senha para começar.</p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label for="register-email" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
                <input id="register-email" type="email" name="email" required class="w-full px-3 py-2 rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm text-slate-900 dark:text-slate-100 focus:border-[#0047AB] outline-none">
            </div>
            <div>
                <label for="register-password" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Senha</label>
                <input id="register-password" type="password" name="password" required class="w-full px-3 py-2 rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm text-slate-900 dark:text-slate-100 focus:border-[#0047AB] outline-none">
            </div>
            <button type="submit" class="w-full py-2 px-4 bg-[#0047AB] hover:bg-[#00398A] text-white text-sm font-medium rounded cursor-pointer">
                Cadastrar
            </button>
        </form>

        <p class="text-sm text-slate-500 dark:text-slate-400 mt-5">
            Já possui conta? <a href="{{ url_for('main.login') }}" class="text-[#0047AB] dark:text-blue-400 font-medium hover:underline">Entrar</a>
        </p>
    </div>
</div>
{% endblock %}
</body>
</html>
