<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - Fintech Dashboard</title>
</head>
<body>
    
        {% extends "base.html" %}
    {% block title %}Login - FintechDash{% endblock %}
    {% block content %}
    <div class="flex min-h-[75vh] items-center justify-center">
        <div class="w-full max-w-md bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Bem-vindo de volta</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Insira os seus dados para aceder à conta</p>
            </div>
            
            <form method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
                    <input type="email" name="email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Senha</label>
                    <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-xs transition cursor-pointer">Entrar</button>
            </form>
            
            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
                Não tem uma conta? <a href="{{ url_for('main.register') }}" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">Registe-se</a>
            </p>
        </div>
    </div>
    {% endblock %}


    <form method="POST">
        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>
        
        <label>Senha:</label><br>
        <input type="password" name="password" required><br><br>
        
        <button type="submit">Entrar</button>
    </form>
    
    <p>Não tens conta? <a href="{{ url_for('main.register') }}">Regista-te aqui</a></p>
</body>
</html>
