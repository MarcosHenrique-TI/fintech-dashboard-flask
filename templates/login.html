<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - Fintech Dashboard</title>
</head>
<body>
    
{% extends "base.html" %}
{% block title %}Entrar - FintechDash{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] items-center justify-center">
    <div class="w-full max-w-md bg-white dark:bg-slate-900 p-6 rounded border border-blue-200/80 dark:border-slate-800">
        <div class="mb-6">
            <h1 class="text-xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Entrar</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Acesse sua conta para gerenciar seus lançamentos.</p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label for="login-email" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
                <input id="login-email" type="email" name="email" required class="w-full px-3 py-2 rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm text-slate-900 dark:text-slate-100 focus:border-[#0047AB] outline-none">
            </div>
            <div>
                <label for="login-password" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Senha</label>
                <input id="login-password" type="password" name="password" required class="w-full px-3 py-2 rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm text-slate-900 dark:text-slate-100 focus:border-[#0047AB] outline-none">
            </div>
            <button type="submit" class="w-full py-2 px-4 bg-[#0047AB] hover:bg-[#00398A] text-white text-sm font-medium rounded cursor-pointer">
                Entrar
            </button>
        </form>

        <p class="text-sm text-slate-500 dark:text-slate-400 mt-5">
            Ainda não tem conta? <a href="{{ url_for('main.register') }}" class="text-[#0047AB] dark:text-blue-400 font-medium hover:underline">Criar conta</a>
        </p>
    </div>
</div>
{% endblock %}


    <form method="POST">
        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>
        
        <label>Senha:</label><br>
        <input type="password" name="password" required><br><br>
        
        <button type="submit">Entrar</button>
    </form>
    
    <p>Não tens conta? <a href="{{ url_for('main.register') }}">Regista-te aqui</a></p>
</body>
</html>
